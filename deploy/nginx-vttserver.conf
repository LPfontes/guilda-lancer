# =========================================================
# BLOCO 6: GUILDA LANCER // BACKEND API & SOCKET.IO (lancer.vttserver.com.br)
# =========================================================

server {
    listen 443 ssl;
    server_name lancer.vttserver.com.br api.lancer.vttserver.com.br;

    ssl_certificate /etc/letsencrypt/live/vttserver.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vttserver.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Suporte essencial para WebSockets em tempo real (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeçalhos de rastreamento e proxy reverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para manter conexões de chat e telemetria persistentes
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}

# =========================================================
# REDIRECIONAMENTO UNIVERSAL HTTP -> HTTPS (PORTA 80)
# =========================================================

server {
    if ($host = stremio.vttserver.com.br) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name vttserver.com.br www.vttserver.com.br v13.vttserver.com.br senna.vttserver.com.br livekit.vttserver.com.br stremio.vttserver.com.br lancer.vttserver.com.br api.lancer.vttserver.com.br;

    return 301 https://$host$request_uri;
}
