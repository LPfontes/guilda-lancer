# =========================================================
# CONFIGURAÇÕES GLOBAIS DE PERFORMANCE
# =========================================================

client_max_body_size 500M; # Aumentado para envios de mapas/mídias e streaming
client_body_timeout 60;
client_header_timeout 60;
send_timeout 60;

# =========================================================
# BLOCO 1: Servidor Principal (vttserver.com.br)
# =========================================================

server {
    listen 443 ssl;
    server_name vttserver.com.br www.vttserver.com.br;
    root /var/www/vttserver;

    ssl_certificate /etc/letsencrypt/live/vttserver.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vttserver.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# =========================================================
# BLOCO 2: TERCEIRA MESA (v13.vttserver.com.br)
# =========================================================

server {
    listen 443 ssl;
    server_name v13.vttserver.com.br;

    ssl_certificate /etc/letsencrypt/live/vttserver.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vttserver.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:30002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

